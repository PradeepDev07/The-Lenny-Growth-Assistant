services:
  # PostgreSQL Relational Database with pgvector extension
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenny_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lenny-network

  # FastAPI Backend Application Service
  backend:
    platform: linux/amd64
    image: pradeepdev17/thelennygrowthassistant-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: lenny-backend
    restart: unless-stopped
    environment:
      - APP_NAME=The Lenny Growth Assistant
      - APP_VERSION=1.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/lenny_assistant
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - MODEL_FOR_INTENT=${MODEL_FOR_INTENT:-gemini-flash-lite-latest}
      - MODEL_FOR_RETRIEVAL_QA=${MODEL_FOR_RETRIEVAL_QA:-gemini-3.8-flash}
      - MODEL_FOR_ESSAY=${MODEL_FOR_ESSAY:-nvidia/nemotron-3-ultra-550b-a55b:free}
      - MODEL_FOR_ARTIFACT=${MODEL_FOR_ARTIFACT:-gemini-3.8-flash}
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,https://lennygrowth.pradeepleadsystems.in
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - lenny-network

  # Next.js Full-Stack Frontend Studio
  frontend:
    platform: linux/amd64
    image: pradeepdev17/thelennygrowthassistant-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://thelennygrowthassistant-backend-latest.onrender.com}
    container_name: lenny-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://thelennygrowthassistant-backend-latest.onrender.com}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lenny-network

volumes:
  postgres_data:
    driver: local

networks:
  lenny-network:
    driver: bridge
